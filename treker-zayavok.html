<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Трекер заявок</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: "#1f2937",
        },
        borderRadius: { card: "12px" },
        boxShadow: {
          soft: "0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06)",
          lift: "0 4px 12px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06)",
        },
      },
    },
  };
</script>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f8fafc;
    color: #1f2937;
    -webkit-font-smoothing: antialiased;
  }

  /* entrance + move animation for cards */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px) scale(.99); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card { animation: cardIn .28s cubic-bezier(.2,.8,.25,1) both; }
  .card.just-moved { animation: cardMove .34s cubic-bezier(.2,.8,.25,1); border-color: #3b82f6; }
  @keyframes cardMove {
    0% { box-shadow: 0 0 0 0 rgba(59,130,246,.35); transform: translateY(0); }
    50% { box-shadow: 0 0 0 4px rgba(59,130,246,.18); transform: translateY(-3px); }
    100% { box-shadow: 0 0 0 0 rgba(59,130,246,.0); transform: translateY(0); }
  }

  /* modal */
  .modal-backdrop { animation: fadeIn .18s ease both; }
  .modal-panel { animation: modalPop .22s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

  /* drop target highlight */
  .drop-zone.drag-over { background: #eff6ff; outline: 2px dashed #93c5fd; outline-offset: -2px; }

  input, select { min-height: 44px; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.just-moved, .modal-backdrop, .modal-panel { animation: none !important; }
  }
</style>
</head>
<body class="min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-9 w-9 rounded-card bg-blue-500 flex items-center justify-center shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16M4 12h10M4 18h7" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-semibold text-ink leading-tight truncate">Трекер заявок</h1>
          <p class="text-xs text-gray-500 hidden sm:block">Мини-CRM для студии уборки</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="total-badge" class="hidden sm:inline-flex items-center gap-1.5 text-sm text-gray-500">
          <span id="total-count" class="font-semibold text-ink">0</span> заявок
        </span>
        <button id="new-btn" class="inline-flex items-center gap-2 rounded-card bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-4 py-2.5 shadow-soft transition-colors active:scale-[.98]">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span class="whitespace-nowrap">Новая заявка</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Board -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 py-6">
    <div id="board" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 items-start"></div>
  </main>

  <!-- Modal -->
  <div id="modal" class="hidden modal-backdrop fixed inset-0 z-30 bg-gray-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="modal-panel w-full max-w-md bg-white rounded-2xl shadow-lift overflow-hidden">
      <div class="px-6 pt-6 pb-2">
        <h2 class="text-lg font-semibold text-ink">Новая заявка</h2>
        <p class="text-sm text-gray-500 mt-0.5">Заявка появится в колонке «Новая заявка»</p>
      </div>
      <form id="form" class="px-6 pb-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="f-name">Имя клиента</label>
          <input id="f-name" name="name" type="text" required autocomplete="off"
            class="w-full rounded-card border border-gray-300 px-3.5 text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Например, Анна Смирнова" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="f-phone">Телефон</label>
          <input id="f-phone" name="phone" type="tel" autocomplete="off"
            class="w-full rounded-card border border-gray-300 px-3.5 text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            placeholder="+7 (900) 000-00-00" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5" for="f-service">Услуга</label>
          <select id="f-service" name="service" required
            class="w-full rounded-card border border-gray-300 px-3.5 text-sm text-ink bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <option value="Генеральная уборка">Генеральная уборка</option>
            <option value="Поддерживающая уборка">Поддерживающая уборка</option>
            <option value="Уборка после ремонта">Уборка после ремонта</option>
            <option value="Комплексная уборка офиса">Комплексная уборка офиса</option>
            <option value="Химчистка дивана">Химчистка дивана</option>
            <option value="Химчистка ковров">Химчистка ковров</option>
            <option value="Мойка окон">Мойка окон</option>
            <option value="Мытьё витрин">Мытьё витрин</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5" for="f-date">Дата</label>
            <input id="f-date" name="date" type="date" required
              class="w-full rounded-card border border-gray-300 px-3.5 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5" for="f-amount">Сумма, ₽</label>
            <input id="f-amount" name="amount" type="number" inputmode="numeric" min="0" required placeholder="7000"
              class="w-full rounded-card border border-gray-300 px-3.5 text-sm text-ink placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
          </div>
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" id="cancel-btn" class="rounded-card border border-gray-300 text-gray-700 text-sm font-medium px-4 py-2.5 hover:bg-gray-50 transition-colors">Отмена</button>
          <button type="submit" class="rounded-card bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium px-4 py-2.5 shadow-soft transition-colors active:scale-[.98]">Добавить</button>
        </div>
      </form>
    </div>
  </div>

<script>
  // ---- Config ----
  const COLUMNS = [
    { key: "new",    title: "Новая заявка",   dot: "#9ca3af", badge: "bg-gray-100 text-gray-600" },
    { key: "work",   title: "В работе",       dot: "#f59e0b", badge: "bg-amber-100 text-amber-700" },
    { key: "confirm",title: "Подтверждено",   dot: "#3b82f6", badge: "bg-blue-100 text-blue-700" },
    { key: "done",   title: "Завершено",      dot: "#22c55e", badge: "bg-green-100 text-green-700" },
  ];
  const STATUS_COLORS = { new: "#9ca3af", work: "#f59e0b", confirm: "#3b82f6", done: "#22c55e" };

  // ---- Mock data ----
  let requests = [
    { id: 1, name: "Анна Смирнова",    phone: "+7 (916) 123-45-67", service: "Генеральная уборка",           date: "15.10.2026", amount: 7600,  status: "new" },
    { id: 2, name: "Иван Петров",      phone: "+7 (921) 555-12-88", service: "Химчистка дивана",             date: "14.10.2026", amount: 5000,  status: "new" },
    { id: 3, name: "Елена Соколова",   phone: "+7 (903) 740-21-09", service: "Химчистка ковров",             date: "15.10.2026", amount: 4500,  status: "new" },
    { id: 4, name: "Мария К.",         phone: "+7 (985) 012-34-56", service: "Мойка окон",                   date: "13.10.2026", amount: 3000,  status: "work" },
    { id: 5, name: "ООО ТехСервис",    phone: "+7 (495) 640-11-22", service: "Мытьё витрин",                 date: "12.10.2026", amount: 9800,  status: "work" },
    { id: 6, name: "ООО Ромашка",      phone: "+7 (812) 300-45-78", service: "Комплексная уборка офиса",     date: "12.10.2026", amount: 15000, status: "confirm" },
    { id: 7, name: "Цех №2",           phone: "+7 (911) 888-90-12", service: "Уборка производственных помещений", date: "11.10.2026", amount: 21000, status: "confirm" },
    { id: 8, name: "Алексей В.",       phone: "+7 (926) 710-33-44", service: "Уборка после ремонта",        date: "10.10.2026", amount: 12000, status: "done" },
    { id: 9, name: "Дмитрий Орлов",    phone: "+7 (906) 279-04-56", service: "Генеральная уборка",           date: "09.10.2026", amount: 8200,  status: "done" },
  ];
  let seq = 10;

  // ---- Helpers ----
  const fmtMoney = (n) => n.toLocaleString("ru-RU") + " ₽";
  const $ = (sel) => document.querySelector(sel);
  const statusIndex = (k) => COLUMNS.findIndex(c => c.key === k);

  const chevron = (dir, disabled) =>
    `<button ${disabled ? "disabled" : ""} class="move-btn ${disabled ? "opacity-30 cursor-not-allowed" : "text-gray-400 hover:text-blue-600 hover:border-blue-500"} border border-gray-200 rounded-card p-1.5 transition-colors" data-dir="${dir}" aria-label="${dir === -1 ? "Назад" : "Вперёд"}">
       <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
         ${dir === -1 ? '<path d="M15 18l-6-6 6-6" />' : '<path d="M9 6l6 6-6 6" />'}
       </svg>
     </button>`;

  function cardHTML(req) {
    const idx = statusIndex(req.status);
    const canPrev = idx > 0;
    const canNext = idx < COLUMNS.length - 1;
    const justMoved = req.id === lastMovedId ? " just-moved" : "";
    return `
      <article draggable="true" class="card${justMoved} group cursor-grab active:cursor-grabbing bg-white rounded-card border border-gray-100 p-4 shadow-soft hover:shadow-lift transition-shadow" data-id="${req.id}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h3 class="font-semibold text-ink text-[15px] leading-snug truncate">${escapeHTML(req.name)}</h3>
            <p class="text-sm text-gray-500 mt-0.5 truncate">${escapeHTML(req.service)}</p>
          </div>
          <span class="shrink-0 h-2 w-2 rounded-full mt-1.5" style="background:${STATUS_COLORS[req.status]}"></span>
        </div>
        <div class="mt-3 pt-3 border-t border-gray-100 flex items-center justify-between">
          <span class="text-xs text-gray-500">${escapeHTML(req.date)}</span>
          <span class="text-sm font-semibold text-ink">${fmtMoney(req.amount)}</span>
        </div>
        <div class="mt-3 flex items-center justify-between">
          ${chevron(-1, !canPrev)}
          <span class="text-[11px] font-medium uppercase tracking-wider text-gray-400 hidden sm:block group-hover:text-gray-500 transition-colors">${COLUMNS[idx].title}</span>
          ${chevron(1, !canNext)}
        </div>
      </article>`;
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ---- Render ----
  let lastMovedId = null;

  function render() {
    const board = $("#board");
    board.innerHTML = COLUMNS.map(col => {
      const items = requests.filter(r => r.status === col.key);
      const cards = items.map(cardHTML).join("") ||
        `<div class="rounded-card border-2 border-dashed border-gray-200 p-6 text-center text-sm text-gray-400">Нет заявок</div>`;
      return `
        <section class="drop-zone rounded-xl bg-gray-50 p-3" data-col="${col.key}">
          <div class="px-1 pb-2.5 flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <span class="h-2 w-2 rounded-full shrink-0" style="background:${col.dot}"></span>
              <h2 class="font-semibold text-gray-700 text-sm truncate">${col.title}</h2>
            </div>
            <span class="inline-flex items-center justify-center min-w-6 h-6 px-1.5 rounded-full text-xs font-semibold ${col.badge}">${items.length}</span>
          </div>
          <div class="space-y-3">${cards}</div>
        </section>`;
    }).join("");

    // total counters
    $("#total-count").textContent = requests.length;
    $("#total-badge").style.display = requests.length ? "inline-flex" : "none";

    lastMovedId = null;
  }

  // ---- Move card via arrows ----
  function move(id, dir) {
    const req = requests.find(r => r.id === id);
    if (!req) return;
    const idx = statusIndex(req.status);
    const next = idx + dir;
    if (next < 0 || next >= COLUMNS.length) return;
    req.status = COLUMNS[next].key;
    lastMovedId = id;
    render();
  }

  // ---- Modal ----
  const modal = $("#modal");
  const form = $("#form");
  function openModal() {
    form.reset();
    $("#f-date").value = new Date().toISOString().slice(0, 10);
    modal.classList.remove("hidden");
    setTimeout(() => $("#f-name").focus(), 60);
  }
  function closeModal() { modal.classList.add("hidden"); }

  // ---- Events ----
  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".move-btn");
    if (btn) {
      const id = Number(btn.closest("article").dataset.id);
      move(id, Number(btn.dataset.dir));
    }
    if (e.target.closest(".modal-backdrop")) closeModal();
  });

  $("#new-btn").addEventListener("click", openModal);
  $("#cancel-btn").addEventListener("click", closeModal);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#f-name").value.trim();
    const service = $("#f-service").value;
    const date = $("#f-date").value;
    const amount = Number($("#f-amount").value) || 0;
    const phone = $("#f-phone").value.trim();
    if (!name || !service || !date) return;

    const dateStr = date.split("-").reverse().join(".");
    requests.unshift({ id: seq++, name, phone, service, date: dateStr, amount, status: "new" });
    closeModal();
    render();
  });

  // ---- Drag & drop (bonus, arrows still work) ----
  let dragId = null;
  document.addEventListener("dragstart", (e) => {
    const card = e.target.closest("[draggable=true]");
    if (!card) return;
    dragId = Number(card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("opacity-50");
  });
  document.addEventListener("dragend", (e) => {
    const card = e.target.closest("[draggable=true]");
    if (card) card.classList.remove("opacity-50");
    dragId = null;
    document.querySelectorAll(".drop-zone").forEach(z => z.classList.remove("drag-over"));
  });
  document.addEventListener("dragover", (e) => {
    const col = e.target.closest(".drop-zone");
    if (!col || dragId === null) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    document.querySelectorAll(".drop-zone").forEach(z => z.classList.remove("drag-over"));
    col.classList.add("drag-over");
  });
  document.addEventListener("drop", (e) => {
    const col = e.target.closest(".drop-zone");
    if (!col || dragId === null) return;
    e.preventDefault();
    const req = requests.find(r => r.id === dragId);
    if (req && req.status !== col.dataset.col) {
      req.status = col.dataset.col;
      lastMovedId = dragId;
      render();
    }
  });

  render();
</script>
</body>
</html>
