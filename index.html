<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини-CRM — Канбан</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-7xl space-y-5 p-4 md:p-8">
    <header class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div>
        <h1 class="text-xl font-bold md:text-2xl">Заявки</h1>
        <p class="text-sm text-slate-500">
          Перетащи карточку — сменится статус. Клик по карточке — редактирование. Данные сохраняются в браузере.
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <input
          id="searchInput"
          type="search"
          placeholder="Поиск по имени или услуге"
          class="w-64 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
        />
        <button
          id="clearSearch"
          class="rounded-xl border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50"
        >
          Сброс
        </button>
        <button
          id="openModalBtn"
          class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700"
        >
          + Новая заявка
        </button>
      </div>
    </header>

    <section
      id="board"
      class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4"
    ></section>
  </main>

  <!-- Модальное окно -->
  <div
    id="modal"
    class="hidden fixed inset-0 z-50 bg-slate-900/40 p-4 backdrop-blur-sm"
  >
    <div class="mx-auto mt-16 w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 id="modalTitle" class="text-lg font-bold">Новая заявка</h2>
        <button
          id="closeModalBtn"
          class="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        >
          ✕
        </button>
      </div>

      <form id="leadForm" class="mt-4 space-y-4">
        <div class="grid gap-4 md:grid-cols-2">
          <label class="space-y-1 text-sm">
            <span>Имя клиента</span>
            <input
              id="leadName"
              required
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="Иван Петров"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Услуга</span>
            <input
              id="leadService"
              required
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="Настройка рекламы"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Дата</span>
            <input
              id="leadDate"
              type="date"
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Сумма, ₽</span>
            <input
              id="leadAmount"
              type="number"
              min="0"
              step="1000"
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="15000"
            />
          </label>
        </div>

        <label class="space-y-1 text-sm">
          <span>Статус</span>
          <select
            id="leadStatus"
            class="w-full rounded-xl border border-slate-300 px-3 py-2"
          ></select>
        </label>

        <div class="flex justify-end gap-2">
          <button
            type="button"
            id="cancelBtn"
            class="rounded-xl border border-slate-300 px-4 py-2 hover:bg-slate-50"
          >
            Отмена
          </button>
          <button
            type="submit"
            id="submitBtn"
            class="rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white hover:bg-slate-700"
          >
            Создать
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mini-crm-leads-v1';

    const STATUSES = [
      {
        id: 'new',
        title: 'Новая',
        accent: 'bg-sky-500',
        badge: 'bg-sky-100 text-sky-700'
      },
      {
        id: 'in-progress',
        title: 'В работе',
        accent: 'bg-amber-500',
        badge: 'bg-amber-100 text-amber-700'
      },
      {
        id: 'confirmed',
        title: 'Подтверждено',
        accent: 'bg-violet-500',
        badge: 'bg-violet-100 text-violet-700'
      },
      {
        id: 'done',
        title: 'Завершено',
        accent: 'bg-emerald-500',
        badge: 'bg-emerald-100 text-emerald-700'
      }
    ];

    const board = document.getElementById('board');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const leadForm = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const leadNameInput = document.getElementById('leadName');
    const leadServiceInput = document.getElementById('leadService');
    const leadDateInput = document.getElementById('leadDate');
    const leadAmountInput = document.getElementById('leadAmount');
    const leadStatus = document.getElementById('leadStatus');

    let searchQuery = '';
    let editingId = null;
    let leads = loadLeads();

    initStatusSelect();
    renderBoard();
    bindStaticEvents();

    function initStatusSelect() {
      leadStatus.innerHTML = STATUSES
        .map((status) => `<option value="${status.id}">${status.title}</option>`)
        .join('');
    }

    function bindStaticEvents() {
      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        renderBoard();
      });

      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        renderBoard();
        searchInput.focus();
      });

      openModalBtn.addEventListener('click', () => openModal());
      closeModalBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);

      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
          closeModal();
        }
      });

      leadForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const name = leadNameInput.value.trim();
        const service = leadServiceInput.value.trim();

        if (!name || !service) return;

        const date = leadDateInput.value || todayISO();
        const amount = Number(leadAmountInput.value || 0);
        const status = leadStatus.value || 'new';

        // Режим редактирования: обновляем существующую заявку.
        if (editingId) {
          const lead = leads.find((item) => item.id === editingId);

          if (lead) {
            lead.name = name;
            lead.service = service;
            lead.date = date;
            lead.amount = amount;
            lead.status = status;
          }

          saveLeads();
          closeModal();
          renderBoard();
          return;
        }

        // Режим создания: добавляем новую заявку.
        const lead = {
          id: makeId(),
          name,
          service,
          date,
          amount,
          status,
          createdAt: new Date().toISOString()
        };

        leads.unshift(lead);
        saveLeads();

        // Чтобы новая заявка была сразу видна, даже если был активен поиск.
        searchInput.value = '';
        searchQuery = '';

        closeModal();
        renderBoard();
      });

      board.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('[data-delete]');

        if (deleteButton) {
          const id = deleteButton.dataset.delete;

          if (confirm('Удалить заявку?')) {
            leads = leads.filter((item) => item.id !== id);
            saveLeads();
            renderBoard();
          }

          return;
        }

        // Клик по карточке (не по крестику) — открываем редактирование.
        const card = event.target.closest('[data-id]');
        if (!card) return;

        const lead = leads.find((item) => item.id === card.dataset.id);
        if (lead) openModal(lead);
      });
    }

    function openModal(lead) {
      if (lead) {
        editingId = lead.id;
        modalTitle.textContent = 'Редактирование заявки';
        submitBtn.textContent = 'Сохранить';

        leadNameInput.value = lead.name;
        leadServiceInput.value = lead.service;
        leadDateInput.value = lead.date || '';
        leadAmountInput.value = lead.amount || '';
        leadStatus.value = lead.status;
      } else {
        editingId = null;
        modalTitle.textContent = 'Новая заявка';
        submitBtn.textContent = 'Создать';
      }

      modal.classList.remove('hidden');
      leadNameInput.focus();
    }

    function closeModal() {
      modal.classList.add('hidden');
      leadForm.reset();
      leadStatus.value = 'new';
      editingId = null;
      modalTitle.textContent = 'Новая заявка';
      submitBtn.textContent = 'Создать';
    }

    function renderBoard() {
      const filtered = getFilteredLeads();
      board.innerHTML = '';

      STATUSES.forEach((status) => {
        const visible = filtered.filter((lead) => lead.status === status.id);
        const total = leads.filter((lead) => lead.status === status.id).length;

        const column = document.createElement('section');
        column.className = 'flex flex-col rounded-2xl border border-slate-200 bg-white shadow-sm';

        column.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 rounded-full ${status.accent}"></span>
              <h2 class="font-semibold">${status.title}</h2>
            </div>
            <span class="rounded-full px-2.5 py-1 text-xs font-semibold ${status.badge}">
              ${searchQuery ? `${visible.length}/${total}` : total}
            </span>
          </div>

          <div
            class="min-h-[140px] flex-1 space-y-3 rounded-b-2xl p-3 transition"
            data-drop="${status.id}"
          >
            ${visible.map(cardTemplate).join('') || emptyTemplate()}
          </div>
        `;

        board.appendChild(column);
      });

      attachDnDHandlers();
    }

    function cardTemplate(lead) {
      return `
        <article
          draggable="true"
          data-id="${escapeHtml(lead.id)}"
          title="Клик — редактировать, перетаскивание — сменить статус"
          class="cursor-grab rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md active:cursor-grabbing"
        >
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold">${escapeHtml(lead.name)}</h3>
            <button
              type="button"
              data-delete="${escapeHtml(lead.id)}"
              class="-mr-1 -mt-1 rounded-lg px-2 py-1 text-slate-300 transition hover:bg-rose-50 hover:text-rose-500"
              title="Удалить"
            >
              ✕
            </button>
          </div>

          <p class="mt-1 text-sm text-slate-500">${escapeHtml(lead.service)}</p>

          <div class="mt-3 flex items-center justify-between text-sm">
            <span class="text-slate-500">${formatDate(lead.date)}</span>
            <span class="font-semibold">${formatMoney(lead.amount)}</span>
          </div>
        </article>
      `;
    }

    function emptyTemplate() {
      return `
        <div class="rounded-xl border border-dashed border-slate-200 p-4 text-center text-sm text-slate-400">
          Пусто
        </div>
      `;
    }

    function attachDnDHandlers() {
      document.querySelectorAll('[draggable="true"]').forEach((card) => {
        card.addEventListener('dragstart', (event) => {
          event.dataTransfer.setData('text/plain', card.dataset.id);
          event.dataTransfer.effectAllowed = 'move';

          setTimeout(() => {
            card.classList.add('opacity-40');
          }, 0);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('opacity-40');
        });
      });

      document.querySelectorAll('[data-drop]').forEach((zone) => {
        zone.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          zone.classList.add('bg-slate-50', 'ring-2', 'ring-slate-300');
        });

        zone.addEventListener('dragleave', (event) => {
          if (!zone.contains(event.relatedTarget)) {
            zone.classList.remove('bg-slate-50', 'ring-2', 'ring-slate-300');
          }
        });

        zone.addEventListener('drop', (event) => {
          event.preventDefault();

          const id = event.dataTransfer.getData('text/plain');
          const status = zone.dataset.drop;

          moveLead(id, status);
          zone.classList.remove('bg-slate-50', 'ring-2', 'ring-slate-300');
        });
      });
    }

    function moveLead(id, status) {
      const lead = leads.find((item) => item.id === id);
      if (!lead || lead.status === status) return;

      lead.status = status;
      saveLeads();
      renderBoard();
    }

    function getFilteredLeads() {
      const query = searchQuery.trim().toLowerCase();

      if (!query) return leads;

      return leads.filter((lead) =>
        `${lead.name} ${lead.service}`.toLowerCase().includes(query)
      );
    }

    function loadLeads() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return saveAndReturn(defaultLeads());
        }

        const parsed = JSON.parse(raw);

        if (!Array.isArray(parsed)) {
          return saveAndReturn(defaultLeads());
        }

        const validStatuses = new Set(STATUSES.map((status) => status.id));

        return parsed.map((lead) => ({
          id: lead.id || makeId(),
          name: lead.name || 'Без имени',
          service: lead.service || 'Без услуги',
          date: lead.date || todayISO(),
          amount: Number(lead.amount || 0),
          status: validStatuses.has(lead.status) ? lead.status : 'new',
          createdAt: lead.createdAt || new Date().toISOString()
        }));
      } catch (error) {
        console.warn('Не удалось загрузить данные из localStorage:', error);
        return defaultLeads();
      }
    }

    function saveLeads() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
      } catch (error) {
        console.warn('localStorage недоступен:', error);
      }
    }

    function saveAndReturn(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.warn('localStorage недоступен:', error);
      }

      return data;
    }

    function defaultLeads() {
      // Если не нужны демо-данные, можно вернуть пустой массив:
      // return [];

      return [
        {
          id: makeId(),
          name: 'Анна Смирнова',
          service: 'Консультация',
          date: todayISO(0),
          amount: 5000,
          status: 'new',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'Иван Петров',
          service: 'Настройка таргета',
          date: todayISO(1),
          amount: 25000,
          status: 'in-progress',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'ООО «Ромашка»',
          service: 'Аудит воронки',
          date: todayISO(-1),
          amount: 40000,
          status: 'confirmed',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'Мария Иванова',
          service: 'Сайт-визитка',
          date: todayISO(-3),
          amount: 90000,
          status: 'done',
          createdAt: new Date().toISOString()
        }
      ];
    }

    function makeId() {
      if (window.crypto && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }

      return `lead-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function todayISO(offsetDays = 0) {
      const date = new Date(Date.now() + offsetDays * 86400000);
      return date.toLocaleDateString('sv-SE');
    }

    function formatDate(value) {
      if (!value) return 'Без даты';

      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        const [year, month, day] = value.split('-').map(Number);
        const date = new Date(year, month - 1, day);

        return date.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return date.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }
  </script>
</body>
</html>
