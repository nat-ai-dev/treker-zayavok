<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мини-CRM — Канбан</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-7xl space-y-5 p-4 md:p-8">
    <header class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div>
        <h1 class="text-xl font-bold md:text-2xl">Заявки</h1>
        <p class="text-sm text-slate-500">
          Перетащи карточку — сменится статус. Клик по карточке — редактирование. Данные сохраняются в браузере.
        </p>
        <p id="boardSummary" class="mt-1 text-sm font-medium text-slate-600"></p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <select
          id="serviceFilterSelect"
          class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
          title="Фильтр по услуге"
        ></select>
        <input
          id="searchInput"
          type="search"
          placeholder="Поиск по имени или услуге"
          class="w-64 rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
        />
        <button
          id="clearSearch"
          class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-500 hover:bg-slate-100 hover:text-slate-700"
          title="Сбросить поиск и фильтр"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Сброс
        </button>
        <button
          id="exportBtn"
          class="inline-flex items-center gap-1.5 rounded-xl border border-sky-200 bg-sky-50 px-3 py-2 text-sm font-medium text-sky-700 hover:bg-sky-100"
          title="Скачать копию данных в JSON"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          Экспорт
        </button>
        <button
          id="importBtn"
          class="inline-flex items-center gap-1.5 rounded-xl border border-violet-200 bg-violet-50 px-3 py-2 text-sm font-medium text-violet-700 hover:bg-violet-100"
          title="Загрузить данные из JSON-файла"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>
          Импорт
        </button>
        <button
          id="openModalBtn"
          class="rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700"
        >
          + Новая заявка
        </button>
      </div>
    </header>

    <section
      id="board"
      class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4"
    ></section>
  </main>

  <!-- Скрытый input для импорта файла -->
  <input id="importInput" type="file" accept=".json,application/json" class="hidden" />

  <!-- Модальное окно -->
  <div
    id="modal"
    class="hidden fixed inset-0 z-50 bg-slate-900/40 p-4 backdrop-blur-sm"
  >
    <div class="mx-auto mt-16 w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 id="modalTitle" class="text-lg font-bold">Новая заявка</h2>
        <button
          id="closeModalBtn"
          class="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700"
        >
          ✕
        </button>
      </div>

      <form id="leadForm" class="mt-4 space-y-4">
        <div class="grid gap-4 md:grid-cols-2">
          <label class="space-y-1 text-sm">
            <span>Имя клиента</span>
            <input
              id="leadName"
              required
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="Иван Петров"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Услуга</span>
            <input
              id="leadService"
              required
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="Настройка рекламы"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Дата</span>
            <input
              id="leadDate"
              type="date"
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
            />
          </label>

          <label class="space-y-1 text-sm">
            <span>Сумма, ₽</span>
            <input
              id="leadAmount"
              type="number"
              min="0"
              step="1000"
              class="w-full rounded-xl border border-slate-300 px-3 py-2"
              placeholder="15000"
            />
          </label>
        </div>

        <label class="space-y-1 text-sm">
          <span>Статус</span>
          <select
            id="leadStatus"
            class="w-full rounded-xl border border-slate-300 px-3 py-2"
          ></select>
        </label>

        <div class="flex justify-end gap-2">
          <button
            type="button"
            id="cancelBtn"
            class="rounded-xl border border-slate-300 px-4 py-2 hover:bg-slate-50"
          >
            Отмена
          </button>
          <button
            type="submit"
            id="submitBtn"
            class="rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white hover:bg-slate-700"
          >
            Создать
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mini-crm-leads-v1';

    const STATUSES = [
      {
        id: 'new',
        title: 'Новая',
        accent: 'bg-sky-500',
        badge: 'bg-sky-100 text-sky-700',
        footer: 'border-t-2 border-sky-200 bg-sky-100/70 text-sky-900'
      },
      {
        id: 'in-progress',
        title: 'В работе',
        accent: 'bg-amber-500',
        badge: 'bg-amber-100 text-amber-700',
        footer: 'border-t-2 border-amber-200 bg-amber-100/70 text-amber-900'
      },
      {
        id: 'confirmed',
        title: 'Подтверждено',
        accent: 'bg-violet-500',
        badge: 'bg-violet-100 text-violet-700',
        footer: 'border-t-2 border-violet-200 bg-violet-100/70 text-violet-900'
      },
      {
        id: 'done',
        title: 'Завершено',
        accent: 'bg-emerald-500',
        badge: 'bg-emerald-100 text-emerald-700',
        footer: 'border-t-2 border-emerald-200 bg-emerald-100/70 text-emerald-900'
      }
    ];

    const board = document.getElementById('board');
    const boardSummary = document.getElementById('boardSummary');
    const serviceFilterSelect = document.getElementById('serviceFilterSelect');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const leadForm = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const leadNameInput = document.getElementById('leadName');
    const leadServiceInput = document.getElementById('leadService');
    const leadDateInput = document.getElementById('leadDate');
    const leadAmountInput = document.getElementById('leadAmount');
    const leadStatus = document.getElementById('leadStatus');

    let searchQuery = '';
    let serviceFilter = '';
    let editingId = null;
    let leads = loadLeads();

    initStatusSelect();
    renderBoard();
    bindStaticEvents();

    function initStatusSelect() {
      leadStatus.innerHTML = STATUSES
        .map((status) => `<option value="${status.id}">${status.title}</option>`)
        .join('');
    }

    function bindStaticEvents() {
      serviceFilterSelect.addEventListener('change', () => {
        serviceFilter = serviceFilterSelect.value;
        renderBoard();
      });

      searchInput.addEventListener('input', () => {
        searchQuery = searchInput.value;
        renderBoard();
      });

      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        serviceFilter = '';
        renderBoard();
        searchInput.focus();
      });

      exportBtn.addEventListener('click', exportLeads);
      importBtn.addEventListener('click', () => importInput.click());
      importInput.addEventListener('change', handleImportFile);

      openModalBtn.addEventListener('click', () => openModal());
      closeModalBtn.addEventListener('click', closeModal);
      cancelBtn.addEventListener('click', closeModal);

      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
          closeModal();
        }
      });

      leadForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const name = leadNameInput.value.trim();
        const service = leadServiceInput.value.trim();

        if (!name || !service) return;

        const date = leadDateInput.value || todayISO();
        const amount = Number(leadAmountInput.value || 0);
        const status = leadStatus.value || 'new';

        // Режим редактирования: обновляем существующую заявку.
        if (editingId) {
          const lead = leads.find((item) => item.id === editingId);

          if (lead) {
            lead.name = name;
            lead.service = service;
            lead.date = date;
            lead.amount = amount;
            lead.status = status;
          }

          saveLeads();
          closeModal();
          renderBoard();
          return;
        }

        // Режим создания: добавляем новую заявку.
        const lead = {
          id: makeId(),
          name,
          service,
          date,
          amount,
          status,
          createdAt: new Date().toISOString()
        };

        leads.unshift(lead);
        saveLeads();

        // Чтобы новая заявка была сразу видна, даже если были активны поиск или фильтр.
        searchInput.value = '';
        searchQuery = '';
        serviceFilter = '';

        closeModal();
        renderBoard();
      });

      board.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('[data-delete]');

        if (deleteButton) {
          const id = deleteButton.dataset.delete;

          if (confirm('Удалить заявку?')) {
            leads = leads.filter((item) => item.id !== id);
            saveLeads();
            renderBoard();
          }

          return;
        }

        // Тап по селекту переноса не должен открывать редактирование.
        if (event.target.closest('[data-move-select]')) return;

        // Клик по карточке (не по крестику) — открываем редактирование.
        const card = event.target.closest('[data-id]');
        if (!card) return;

        const lead = leads.find((item) => item.id === card.dataset.id);
        if (lead) openModal(lead);
      });

      // Мобильный перенос: смена статуса через селект на карточке.
      board.addEventListener('change', (event) => {
        const select = event.target.closest('[data-move-select]');
        if (!select) return;

        moveLead(select.dataset.moveSelect, select.value);
      });
    }

    function exportLeads() {
      if (!leads.length) {
        alert('Нечего экспортировать: доска пуста.');
        return;
      }

      const blob = new Blob([JSON.stringify(leads, null, 2)], {
        type: 'application/json'
      });
      const url = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = url;
      link.download = `mini-crm-leads-${todayISO()}.json`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const normalized = normalizeLeads(parsed);

          if (!normalized) {
            throw new Error('Ожидался массив заявок');
          }

          if (!normalized.length) {
            alert('В файле нет ни одной заявки.');
            return;
          }

          const confirmed = confirm(
            `Импортировать заявок: ${normalized.length}.\n` +
            `Текущие заявки (${leads.length}) будут заменены. Продолжить?`
          );

          if (!confirmed) return;

          leads = normalized;
          saveLeads();

          searchInput.value = '';
          searchQuery = '';
          serviceFilter = '';

          renderBoard();
        } catch (error) {
          console.warn('Ошибка импорта:', error);
          alert('Не удалось прочитать файл: ожидался JSON с массивом заявок.');
        } finally {
          // Сбрасываем value, чтобы тот же файл можно было выбрать повторно.
          importInput.value = '';
        }
      };

      reader.readAsText(file);
    }

    function openModal(lead) {
      if (lead) {
        editingId = lead.id;
        modalTitle.textContent = 'Редактирование заявки';
        submitBtn.textContent = 'Сохранить';

        leadNameInput.value = lead.name;
        leadServiceInput.value = lead.service;
        leadDateInput.value = lead.date || '';
        leadAmountInput.value = lead.amount || '';
        leadStatus.value = lead.status;
      } else {
        editingId = null;
        modalTitle.textContent = 'Новая заявка';
        submitBtn.textContent = 'Создать';
      }

      modal.classList.remove('hidden');
      leadNameInput.focus();
    }

    function closeModal() {
      modal.classList.add('hidden');
      leadForm.reset();
      leadStatus.value = 'new';
      editingId = null;
      modalTitle.textContent = 'Новая заявка';
      submitBtn.textContent = 'Создать';
    }

    function updateServiceFilter() {
      const counts = new Map();

      leads.forEach((lead) => {
        counts.set(lead.service, (counts.get(lead.service) || 0) + 1);
      });

      // Если выбранной услуги больше нет в данных — сбрасываем фильтр.
      if (serviceFilter && !counts.has(serviceFilter)) {
        serviceFilter = '';
      }

      const services = [...counts.keys()].sort((a, b) => a.localeCompare(b, 'ru'));

      serviceFilterSelect.innerHTML = [
        `<option value="">Все услуги (${leads.length})</option>`,
        ...services.map((service) =>
          `<option value="${escapeHtml(service)}"${service === serviceFilter ? ' selected' : ''}>${escapeHtml(service)} (${counts.get(service)})</option>`
        )
      ].join('');
    }

    function renderBoard() {
      updateServiceFilter();

      const filtered = getFilteredLeads();
      const anyFilter = Boolean(searchQuery.trim() || serviceFilter);

      board.innerHTML = '';

      // Сводка по всей доске в шапке.
      if (anyFilter) {
        boardSummary.textContent =
          `Найдено: ${filtered.length} из ${leads.length}, на ${formatMoney(sumLeads(filtered))}`;
      } else {
        boardSummary.textContent =
          `На доске: ${leads.length} ${pluralize(leads.length, ['заявка', 'заявки', 'заявок'])} на ${formatMoney(sumLeads(leads))}`;
      }

      STATUSES.forEach((status) => {
        const statusLeads = leads.filter((lead) => lead.status === status.id);
        const visible = filtered.filter((lead) => lead.status === status.id);
        const visibleSum = sumLeads(visible);
        const totalSum = sumLeads(statusLeads);

        const column = document.createElement('section');
        column.className =
          'flex flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm';

        column.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 rounded-full ${status.accent}"></span>
              <h2 class="font-semibold">${status.title}</h2>
            </div>
            <span class="rounded-full px-2.5 py-1 text-xs font-semibold ${status.badge}">
              ${anyFilter ? `${visible.length}/${statusLeads.length}` : statusLeads.length}
            </span>
          </div>

          <div
            class="min-h-[140px] flex-1 space-y-3 p-3 transition"
            data-drop="${status.id}"
          >
            ${visible.map(cardTemplate).join('') || emptyTemplate()}
          </div>

          <div class="flex items-center justify-between px-4 py-2 ${status.footer}">
            <span class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide opacity-80">
              <span class="h-2 w-2 rounded-full ${status.accent}"></span>
              Сумма
            </span>
            <span class="text-sm font-bold">
              ${formatMoney(visibleSum)}${anyFilter ? `<span class="font-normal opacity-60"> из ${formatMoney(totalSum)}</span>` : ''}
            </span>
          </div>
        `;

        board.appendChild(column);
      });

      attachDnDHandlers();
    }

    function cardTemplate(lead) {
      return `
        <article
          draggable="true"
          data-id="${escapeHtml(lead.id)}"
          title="Клик — редактировать, перетаскивание — сменить статус"
          class="cursor-grab rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md active:cursor-grabbing"
        >
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold">${escapeHtml(lead.name)}</h3>
            <button
              type="button"
              data-delete="${escapeHtml(lead.id)}"
              class="-mr-1 -mt-1 rounded-lg px-2 py-1 text-slate-300 transition hover:bg-rose-50 hover:text-rose-500"
              title="Удалить"
            >
              ✕
            </button>
          </div>

          <p class="mt-1 text-sm text-slate-500">${escapeHtml(lead.service)}</p>

          <div class="mt-3 flex items-center justify-between text-sm">
            <span class="text-slate-500">${formatDate(lead.date)}</span>
            <span class="font-semibold">${formatMoney(lead.amount)}</span>
          </div>

          <select
            data-move-select="${escapeHtml(lead.id)}"
            class="mt-3 w-full rounded-lg border border-slate-200 bg-slate-50 px-2 py-1.5 text-xs font-medium text-slate-600 focus:outline-none md:hidden"
            title="Перенести в статус"
          >
            ${STATUSES
              .map((status) =>
                `<option value="${status.id}" ${status.id === lead.status ? 'selected' : ''}>${status.title}</option>`
              )
              .join('')}
          </select>
        </article>
      `;
    }

    function emptyTemplate() {
      return `
        <div class="rounded-xl border border-dashed border-slate-200 p-4 text-center text-sm text-slate-400">
          Пусто
        </div>
      `;
    }

    function attachDnDHandlers() {
      document.querySelectorAll('[draggable="true"]').forEach((card) => {
        card.addEventListener('dragstart', (event) => {
          event.dataTransfer.setData('text/plain', card.dataset.id);
          event.dataTransfer.effectAllowed = 'move';

          setTimeout(() => {
            card.classList.add('opacity-40');
          }, 0);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('opacity-40');
        });
      });

      document.querySelectorAll('[data-drop]').forEach((zone) => {
        zone.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          zone.classList.add('bg-slate-50', 'ring-2', 'ring-slate-300');
        });

        zone.addEventListener('dragleave', (event) => {
          if (!zone.contains(event.relatedTarget)) {
            zone.classList.remove('bg-slate-50', 'ring-2', 'ring-slate-300');
          }
        });

        zone.addEventListener('drop', (event) => {
          event.preventDefault();

          const id = event.dataTransfer.getData('text/plain');
          const status = zone.dataset.drop;

          moveLead(id, status);
          zone.classList.remove('bg-slate-50', 'ring-2', 'ring-slate-300');
        });
      });
    }

    function moveLead(id, status) {
      const lead = leads.find((item) => item.id === id);
      if (!lead || lead.status === status) return;

      lead.status = status;
      saveLeads();
      renderBoard();
    }

    function getFilteredLeads() {
      const query = searchQuery.trim().toLowerCase();

      return leads.filter((lead) => {
        const matchesService = !serviceFilter || lead.service === serviceFilter;
        const matchesQuery =
          !query || `${lead.name} ${lead.service}`.toLowerCase().includes(query);

        return matchesService && matchesQuery;
      });
    }

    function sumLeads(list) {
      return list.reduce((acc, lead) => acc + (Number(lead.amount) || 0), 0);
    }

    function pluralize(count, forms) {
      const n = Math.abs(count) % 100;
      const last = n % 10;

      if (n > 10 && n < 20) return forms[2];
      if (last > 1 && last < 5) return forms[1];
      if (last === 1) return forms[0];

      return forms[2];
    }

    function normalizeLeads(parsed) {
      if (!Array.isArray(parsed)) return null;

      const validStatuses = new Set(STATUSES.map((status) => status.id));

      return parsed
        .filter((item) => item && typeof item === 'object')
        .map((lead) => ({
          id: typeof lead.id === 'string' && lead.id ? lead.id : makeId(),
          name: String(lead.name || 'Без имени'),
          service: String(lead.service || 'Без услуги'),
          date: typeof lead.date === 'string' && lead.date ? lead.date : todayISO(),
          amount: Number(lead.amount || 0),
          status: validStatuses.has(lead.status) ? lead.status : 'new',
          createdAt: typeof lead.createdAt === 'string' ? lead.createdAt : new Date().toISOString()
        }));
    }

    function loadLeads() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return saveAndReturn(defaultLeads());
        }

        const normalized = normalizeLeads(JSON.parse(raw));

        if (!normalized) {
          return saveAndReturn(defaultLeads());
        }

        return normalized;
      } catch (error) {
        console.warn('Не удалось загрузить данные из localStorage:', error);
        return defaultLeads();
      }
    }

    function saveLeads() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
      } catch (error) {
        console.warn('localStorage недоступен:', error);
      }
    }

    function saveAndReturn(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.warn('localStorage недоступен:', error);
      }

      return data;
    }

    function defaultLeads() {
      // Если не нужны демо-данные, можно вернуть пустой массив:
      // return [];

      return [
        {
          id: makeId(),
          name: 'Анна Смирнова',
          service: 'Консультация',
          date: todayISO(0),
          amount: 5000,
          status: 'new',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'Иван Петров',
          service: 'Настройка таргета',
          date: todayISO(1),
          amount: 25000,
          status: 'in-progress',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'ООО «Ромашка»',
          service: 'Аудит воронки',
          date: todayISO(-1),
          amount: 40000,
          status: 'confirmed',
          createdAt: new Date().toISOString()
        },
        {
          id: makeId(),
          name: 'Мария Иванова',
          service: 'Сайт-визитка',
          date: todayISO(-3),
          amount: 90000,
          status: 'done',
          createdAt: new Date().toISOString()
        }
      ];
    }

    function makeId() {
      if (window.crypto && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }

      return `lead-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function todayISO(offsetDays = 0) {
      const date = new Date(Date.now() + offsetDays * 86400000);
      return date.toLocaleDateString('sv-SE');
    }

    function formatDate(value) {
      if (!value) return 'Без даты';

      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
        const [year, month, day] = value.split('-').map(Number);
        const date = new Date(year, month - 1, day);

        return date.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: 'short',
          year: 'numeric'
        });
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHtml(value);
      }

      return date.toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
    }

    function formatMoney(value) {
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }
  </script>
